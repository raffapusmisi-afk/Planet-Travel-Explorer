<head>
<meta charset="utf-8">

<title>Planet Travel Explorer 🌍</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(#bdf0c0,#e9fbd9 60%,#cdf3d4);color:#14502b}
canvas{position:fixed;inset:0}
h1{position:fixed;top:10px;left:0;right:0;margin:0;text-align:center;font-size:clamp(1.3rem,4vw,2rem);color:#1f6b3a;text-shadow:0 2px 0 #fff;pointer-events:none}
#mascot{position:fixed;top:56px;left:12px;display:flex;gap:8px;align-items:flex-end;max-width:72%}
#mascot .f svg{width:84px;height:84px;display:block}#mascot .f{animation:hop 1.6s ease-in-out infinite}
#say{background:#fff;border:3px solid #58b868;border-radius:18px 18px 18px 4px;padding:8px 12px;font-weight:700}
@keyframes hop{50%{transform:translateY(-6px)}}
#snd{position:fixed;top:10px;right:12px;width:44px;height:44px;border-radius:50%;border:3px solid #3f9b4b;background:#fff;font-size:20px;cursor:pointer;z-index:5}
#panel{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:680px;box-sizing:border-box;max-height:38vh;overflow:auto;background:#fffff6;border:4px solid #58b868;border-bottom:0;border-radius:26px 26px 0 0;padding:12px 16px 20px;transition:transform .6s}
#panel.hide{transform:translate(-50%,115%)}
#crumbs{font-size:.9rem;margin-bottom:8px;min-height:1.3em}
#crumbs button{all:unset;cursor:pointer;text-decoration:underline;margin-right:6px}
.opts{display:grid;gap:8px}
.opts button,.btn{font:inherit;font-weight:700;color:#14502b;background:#86e07f;border:3px solid #3f9b4b;border-radius:16px;box-shadow:0 4px 0 #3f9b4b;padding:10px 14px;text-align:left;cursor:pointer}
.opts button:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3f9b4b}
.opts button:focus-visible,.btn:focus-visible,#snd:focus-visible{outline:3px solid #ff7aa8}
.opts small{display:block;font-weight:400}
.btn.alt{background:#fff}
#fade{position:fixed;inset:0;background:radial-gradient(circle,#fff 10%,#d8f7d4 60%,#a9e8b0);opacity:0;pointer-events:none;transition:opacity .7s;z-index:3;overflow:hidden}
#fade.on{opacity:1;pointer-events:auto}
#fade i{position:absolute;font-style:normal;font-size:70px;animation:drift 9s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
#card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,560px);max-height:88vh;overflow:auto;box-sizing:border-box;background:#fffff6;border:4px solid #58b868;border-radius:26px;padding:18px 20px;z-index:4;display:none}
#card h2{margin:0;font-size:1.5rem}
#card .w{margin:0 0 10px;opacity:.75}
#card pre{font:14px/1.2 Consolas,Menlo,monospace;background:#e9fbe4;border:2px dashed #58b868;border-radius:12px;padding:12px;overflow-x:auto;color:#1f6b3a}
#card a{color:#1f7a45}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#start{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#a8ecaa,#e2fbd2);padding:20px}
#start .e{font-size:90px;animation:hop 1.6s ease-in-out infinite}
#start h2{margin:0;font-size:2rem}
@media (prefers-reduced-motion:reduce){#mascot .f,#start .e,#fade i{animation:none}}
</style>
</head>

// ---------- Musik & efek suara (WebAudio, tanpa file) ----------
let AC, master, muted=false, stp=0;
const MID=m=>440*Math.pow(2,(m-69)/12);
const CH=[[60,64,67,72],[57,60,64,69],[53,57,60,65],[55,59,62,67]];
function note(m,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=MID(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
function tick(){if(!AC||AC.state!=="running")return;const t=AC.currentTime+.05,c=CH[Math.floor(stp/8)%4],p=[0,1,2,3,2,1,3,2];note(c[p[stp%8]]+(stp%16>=8?12:0),t,.55,"triangle",.22);if(stp%8===0)note(c[0]-24,t,2,"sine",.32);stp++;}
function startAudio(){if(AC){AC.resume();return;}AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.95;master.connect(AC.destination);setInterval(tick,300);}
function sfx(f1,f2,d){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d);}
document.getElementById("snd").onclick=()=>{muted=!muted;if(master)master.gain.value=muted?0:.95;document.getElementById("snd").textContent=muted?"🔇":"🔊";};

// ---------- Globe ----------
const $=id=>document.getElementById(id), cv=$("g"), cx=cv.getContext("2d"), D=Math.PI/180;
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W,H,DPR,cam={lon:100,lat:20,k:.95},tw=null,st={lvl:0,c:null,n:null},busy=false,pins=[];
function size(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener("resize",size);size();
const geom=()=>({R:Math.min(W*.46,H*.34)*cam.k,x:W/2,y:H*.4});
function pj(lo,la){const l=(lo-cam.lon)*D,p=la*D,p0=cam.lat*D;return[Math.cos(p)*Math.sin(l),Math.cos(p0)*Math.sin(p)-Math.sin(p0)*Math.cos(p)*Math.cos(l),Math.sin(p0)*Math.sin(p)+Math.cos(p0)*Math.cos(p)*Math.cos(l)];}
function path(pts,g){let any=false;cx.beginPath();pts.forEach(([lo,la],i)=>{let[x,y,c]=pj(lo,la);if(c>0)any=true;else{const m=Math.hypot(x,y)||1;x/=m;y/=m;}i?cx.lineTo(g.x+g.R*x,g.y-g.R*y):cx.moveTo(g.x+g.R*x,g.y-g.R*y);});cx.closePath();return any;}
const CL=[...Array(6)].map((_,i)=>({x:i*180,y:30+Math.random()*260,s:.6+Math.random()*.8,v:.15+Math.random()*.2}));
function draw(ts){
 cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,W,H);
 CL.forEach(c=>{c.x=(c.x+c.v)%(W+200);cx.fillStyle="rgba(255,255,255,.8)";const s=c.s*22,x=c.x-100;[[0,0,1],[1,-.5,1.3],[2,0,1]].forEach(([a,b,r])=>{cx.beginPath();cx.arc(x+a*s,c.y+b*s,s*r,0,7);cx.fill();});});
 const g=geom();
 let gr=cx.createRadialGradient(g.x,g.y,g.R*.95,g.x,g.y,g.R*1.12);gr.addColorStop(0,"rgba(255,255,255,.8)");gr.addColorStop(1,"rgba(255,255,255,0)");
 cx.fillStyle=gr;cx.beginPath();cx.arc(g.x,g.y,g.R*1.12,0,7);cx.fill();
 cx.save();cx.beginPath();cx.arc(g.x,g.y,g.R,0,7);cx.clip();
 gr=cx.createRadialGradient(g.x-g.R*.35,g.y-g.R*.4,g.R*.1,g.x,g.y,g.R);gr.addColorStop(0,"#d4f7ea");gr.addColorStop(1,"#5cc9b3");
 cx.fillStyle=gr;cx.fillRect(0,0,W,H);
 cx.strokeStyle="rgba(255,255,255,.4)";cx.lineWidth=1;
 const line=pts=>{cx.beginPath();let on=false;pts.forEach(([lo,la])=>{const[x,y,c]=pj(lo,la);if(c>0){on?cx.lineTo(g.x+g.R*x,g.y-g.R*y):cx.moveTo(g.x+g.R*x,g.y-g.R*y);on=true;}else on=false;});cx.stroke();};
 for(let lo=-180;lo<180;lo+=30){const a=[];for(let la=-90;la<=90;la+=5)a.push([lo,la]);line(a);}
 for(let la=-60;la<=60;la+=30){const a=[];for(let lo=-180;lo<=180;lo+=5)a.push([lo,la]);line(a);}
 cx.lineJoin="round";cx.lineWidth=Math.max(1.5,g.R/160);cx.strokeStyle="#3f9b4b";
 LAND.forEach(([col,pts])=>{if(path(pts,g)){cx.fillStyle=col;cx.fill();cx.stroke();}});
 LAKE.forEach(pts=>{if(path(pts,g)){cx.fillStyle="#7ed6c1";cx.fill();}});
 gr=cx.createRadialGradient(g.x-g.R*.3,g.y-g.R*.35,g.R*.5,g.x,g.y,g.R);gr.addColorStop(0,"rgba(255,255,255,0)");gr.addColorStop(1,"rgba(10,90,60,.35)");
 cx.fillStyle=gr;cx.fillRect(0,0,W,H);cx.restore();
 cx.beginPath();cx.arc(g.x,g.y,g.R,0,7);cx.strokeStyle="#3f9b4b";cx.lineWidth=4;cx.stroke();
 // pin
 cx.font="700 14px 'Trebuchet MS',sans-serif";cx.textAlign="center";
 pins.forEach((p,i)=>{const[x,y,c]=pj(p.lon,p.lat);if(c<.15)return;const px=g.x+g.R*x,py=g.y-g.R*y,b=RM?0:Math.abs(Math.sin(ts/350+i))*7;
  cx.fillStyle="rgba(0,60,30,.25)";cx.beginPath();cx.ellipse(px,py,7,3,0,0,7);cx.fill();
  cx.fillStyle="#ff7aa8";cx.strokeStyle="#fff";cx.lineWidth=3;cx.beginPath();cx.arc(px,py-12-b,9,0,7);cx.fill();cx.stroke();
  cx.fillStyle="#fff";cx.beginPath();cx.arc(px-3,py-15-b,2.5,0,7);cx.fill();
  const ty=i%2?py+22:py-32-b,w=cx.measureText(p.name).width+14;
  cx.fillStyle="#fff";cx.strokeStyle="#58b868";cx.lineWidth=2;cx.beginPath();cx.roundRect(px-w/2,ty-15,w,22,11);cx.fill();cx.stroke();
  cx.fillStyle="#14502b";cx.fillText(p.name,px,ty);});
}
function fly(to,dur,cb){busy=true;const f={...cam};tw={f,dl:((to.lon-f.lon+540)%360)-180,to,t0:performance.now(),dur:RM?1:dur,cb};}
function loop(ts){
 if(tw){const t=Math.min(1,(ts-tw.t0)/tw.dur),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  cam.lon=tw.f.lon+tw.dl*e;cam.lat=tw.f.lat+(tw.to.lat-tw.f.lat)*e;cam.k=tw.f.k*Math.pow(tw.to.k/tw.f.k,e);
  if(t>=1){const c=tw.cb;tw=null;busy=false;c&&c();}}
 else if(st.lvl===0&&!RM&&$("start").style.display==="none")cam.lon+=.1;
 draw(ts);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- Alur ----------
const say=t=>$("say").textContent=t;
const EM={Eropa:"🏰",Amerika:"🗽",Asia:"🏯"};
function mk(label,small,fn){const b=document.createElement("button");b.append(label);if(small){const s=document.createElement("small");s.textContent=small;b.append(s);}b.onclick=()=>{if(busy)return;sfx(520,880,.15);fn();};return b;}
function menu(){
 const o=$("opts"),cr=$("crumbs");o.replaceChildren();cr.replaceChildren();
 const crumb=(t,fn)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{if(!busy)fn();};cr.append(b);};
 if(st.lvl>0)crumb("🌍 Dunia",goHome);
 if(st.lvl>1)crumb(DATA[st.c].n,()=>goCont(st.c));
 if(st.lvl===0){pins=DATA.map((b,i)=>({name:b.n,lon:GEO.cont[b.n][1],lat:GEO.cont[b.n][0]}));
  DATA.forEach((b,i)=>o.append(mk(EM[b.n]+" "+b.n,b.c.length+" negara",()=>goCont(i))));say("Halo! Pilih benua, yuk!");}
 if(st.lvl===1){const b=DATA[st.c];pins=b.c.map(c=>({name:c.n,lon:GEO.ctry[c.n][1],lat:GEO.ctry[c.n][0]}));
  b.c.forEach((c,i)=>o.append(mk("📍 "+c.n,c.k.length+" kota",()=>goCtry(st.c,i))));say("Mau ke negara mana?");}
 if(st.lvl===2){const c=DATA[st.c].c[st.n];pins=c.k.map(k=>({name:k[0],lon:GEO.city[k[0]][1],lat:GEO.city[k[0]][0]}));
  c.k.forEach((k,i)=>o.append(mk("🏙️ "+k[0],k[1],()=>dive(st.c,st.n,i))));say("Pilih kota, lalu kita terjun!");}
}
function goHome(){st={lvl:0};menu();fly({lat:20,lon:cam.lon,k:.95},1400);}
function goCont(i){st={lvl:1,c:i};menu();const g=GEO.cont[DATA[i].n];fly({lat:g[0],lon:g[1],k:g[2]},1800);}
function goCtry(i,n){st={lvl:2,c:i,n};menu();const g=GEO.ctry[DATA[i].c[n].n];fly({lat:g[0],lon:g[1],k:g[2]},2000);}
function dive(i,n,j){
 const k=DATA[i].c[n].k[j],g=GEO.city[k[0]];busy=true;pins=[{name:k[0],lon:g[1],lat:g[0]}];
 $("panel").classList.add("hide");say("Wuuusss! Terjun ke "+k[0]+"!");sfx(900,120,1.6);
 fly({lat:g[0],lon:g[1],k:22},2800,()=>{$("fade").classList.add("on");setTimeout(()=>{
  $("cm").textContent=k[1];$("cw").textContent=k[0]+", "+DATA[i].c[n].n;$("cd").textContent=k[2];$("ca").textContent=k[3].replace(/^\n/,"");
  $("cl").href="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(k[1]+" "+k[0]);
  $("card").style.display="block";sfx(660,1320,.4);},700);});
}
function back(){$("card").style.display="none";$("fade").classList.remove("on");$("panel").classList.remove("hide");}
$("again").onclick=()=>{back();const g=GEO.ctry[DATA[st.c].c[st.n].n];cam={lat:g[0],lon:g[1],k:g[2]};menu();};
$("home").onclick=()=>{back();st={lvl:0};cam.k=.95;cam.lat=20;menu();};
$("go").onclick=()=>{startAudio();$("start").style.display="none";};
menu();
</script>
